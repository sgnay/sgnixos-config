advisor:
  enabled: true
memory:
  backend: local
startup:
  quiet: true
  showSplash: false
composer:
  shape: pi
steeringMode: one-at-a-time
interruptMode: immediate
theme:
  dark: titanium
  light: light
symbolPreset: nerd
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: default
  separator: powerline-thin
modelRoles:
  smol: freellmapi/auto:high
  slow: freellmapi/auto:high
  plan: freellmapi/auto:high
  vision: google/gemini-3.1-pro-preview
  advisor: agnes-ai/agnes-3.0-flash:high
  task: freellmapi/auto:high
  web: web/exa
  tiny: local/qwen3-1.7b
  default: kakou/deepseek-v4.1-flash:high
defaultThinkingLevel: high
hideThinkingBlock: false
thinkingBudgets:
  minimal: 1024
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768
  max: 32768
tools:
  format: auto
  approvalMode: yolo
  approval:
    bash: allow
    read: allow
    edit: allow
    eval: allow
bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 60000
  patterns:
    - match: rm -rf *
      approval: prompt
    - match: git push *
      approval: prompt
    - match: sudo *
      approval: prompt
    - match: dd *
      approval: deny
  allowCompoundCommands: true
  gitGuard: true
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false
compaction:
  enabled: true
  methodOrder:
    - remote
    - snapcompact
    - handoff
    - shake
    - soft
  midTurnEnabled: true
  thresholdPercent: 80
  keepRecentTokens: 20000
providers:
  cacheRetention: auto
disabledProviders:
  []
retry:
  enabled: true
  maxRetries: 999
  fallbackOn: any
dev:
  autoqaConsent: granted
plan:
  enabled: true
astGrep:
  enabled: true
github:
  enabled: true
security:
  enabled: true
bashInterceptor:
  enabled: true