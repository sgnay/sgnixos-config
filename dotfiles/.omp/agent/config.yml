advisor:
  enabled: true
memory:
  backend: local
startup:
  quiet: true
  showSplash: false
composer:
  shape: pi
steeringMode: one-at-a-time
interruptMode: immediate
theme:
  dark: titanium
  light: light
symbolPreset: nerd
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: default
  separator: powerline-thin
modelRoles:
  smol: freellmapi/auto:high
  slow: freellmapi/auto:high
  plan: freellmapi/auto:high
  vision: google/gemini-3.1-pro-preview
  advisor: freellmapi/auto:high
  task: freellmapi/auto:high
  default: opencode-go/space-bunny-free:high
  web: google/gemini-2.5-flash
defaultThinkingLevel: high
hideThinkingBlock: false
thinkingBudgets:
  minimal: 1024
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768
  max: 32768
tools:
  format: auto
  approvalMode: write
  approval:
    bash: allow
    read: allow
    edit: allow
    eval: allow
bash:
  enabled: true
  autoBackground:
    enabled: true
    thresholdMs: 60000
  patterns:
    - match: rm -rf *
      approval: prompt
    - match: git push *
      approval: prompt
    - match: sudo *
      approval: prompt
    - match: dd *
      approval: deny
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  formatOnWrite: false
compaction:
  enabled: true
  methodOrder:
    - remote
    - snapcompact
    - handoff
    - shake
    - soft
  midTurnEnabled: true
  thresholdPercent: 80
  keepRecentTokens: 20000
providers:
  cacheRetention: auto
disabledProviders:
  []
retry:
  fallbackChains:
    web:
      - web/perplexity
      - web/exa
      - web/parallel
      - google-antigravity/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public